name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.118.0
  DB_SCHEMAS: core,crm,catalog,inv,sales,fin,fiscal,omni,ai,hr,comm,purch,private,agent

jobs:
  # ---------------------------------------------------------------- Web (Next.js) + pacotes TypeScript
  web:
    name: Web (typecheck, lint, testes, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # a versão vem do campo packageManager do package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck lint test --continue
      - name: Build de produção
        run: pnpm --filter @centralops/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # ---------------------------------------------------------------- Banco (pgTAP), Python (worker, MCP, contrato) e Edge Functions
  backend:
    name: Banco, Python e Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Só o Postgres e o GoTrue (o seed cria usuários em auth.users); o resto da stack não é necessário para os testes
      - name: Subir o Supabase local
        run: supabase start -x studio,imgproxy,logflare,vector,mailpit,edge-runtime,realtime,storage-api,postgres-meta,postgrest,kong,supavisor
      - name: Migrations + seeds do zero
        run: supabase db reset
      - name: pgTAP
        run: supabase test db
      - name: Lint das funções PL/pgSQL
        run: supabase db lint --local --level error --fail-on error --schema "$DB_SCHEMAS"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Ruff
        run: uvx ruff check apps
      - name: Contrato do agente
        run: uv run --package centralops-agent-contract pytest apps/agent/contract/tests -q
      - name: Worker (contra o Postgres local)
        run: uv run --package centralops-worker pytest apps/worker/tests -q
      - name: Servidor MCP (contra o Postgres local)
        run: uv run --package centralops-mcp pytest apps/agent/mcp_server/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Funções de webhook (HMAC, chaves de idempotência)
        run: node --test "supabase/functions/_shared/*.test.ts"

      - name: Parar o Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------- E2E (Playwright, desktop e celular) contra o Supabase local completo
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # O app precisa de Auth e da API (PostgREST); estúdio, e-mail, logs, storage e funções ficam de fora
      - name: Subir o Supabase local
        run: supabase start -x studio,imgproxy,logflare,vector,mailpit,edge-runtime,storage-api,postgres-meta,supavisor
      - name: Migrations + seeds do zero
        run: supabase db reset
      - name: Chaves locais para o app
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"
      - name: Build de produção do app
        run: pnpm --filter @centralops/web build
      - name: Navegador do Playwright
        run: pnpm --filter @centralops/web exec playwright install --with-deps chromium
      - name: Testes E2E
        run: pnpm --filter @centralops/web e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Parar o Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------- Imagens Docker (constroem em todo PR; publicam só em push na main)
  images:
    name: Imagem ${{ matrix.image }}
    needs: [web, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: web, dockerfile: apps/web/Dockerfile }
          - { image: worker, dockerfile: apps/worker/Dockerfile }
          - { image: mcp, dockerfile: apps/agent/mcp_server/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem em minúsculas (exigência do GHCR)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/centralops" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:55321' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
