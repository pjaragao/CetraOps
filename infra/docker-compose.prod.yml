# CentralOps — stack de produção na VPS (Coolify + Traefik). O banco NÃO roda aqui: é o Supabase Cloud (sa-east-1).
#
# Só o `web` é público (Traefik, TLS automático). `worker`, `mcp` e `hermes` ficam na rede interna, sem porta publicada:
#   web ──(Supabase, JWT do usuário + RLS)──▶ Supabase
#   worker ──▶ Supabase (conexão de serviço) · Meta · Telegram · Focus NFe · OpenRouter · Hermes
#   hermes ──▶ OpenRouter · mcp
#   mcp ──▶ Supabase (role agent_rpc: só EXECUTE em agent.*)
#
# Segredos: variáveis criptografadas do Coolify (modelo em infra/.env.example). Nada de .env versionado.
# Subir à mão (fora do Coolify):  docker compose --env-file .env -f infra/docker-compose.prod.yml up -d

name: centralops

x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # Roda a cada deploy ANTES de web e worker: confere o banco e aplica as migrations que faltarem (e o administrador inicial).
  # Se falhar, web e worker não sobem a versão nova sobre um banco desatualizado. Ver apps/worker/centralops_worker/migrate.py.
  migrate:
    <<: *hardening
    image: ghcr.io/${CENTRALOPS_IMAGE_OWNER:?}/centralops-worker:${CENTRALOPS_TAG:-prod}
    command: ["centralops-migrate"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      CENTRALOPS_DATABASE_URL: ${CENTRALOPS_DATABASE_URL:?conexão de serviço do Supabase (como usuário postgres)}
      CENTRALOPS_LOG_LEVEL: ${CENTRALOPS_LOG_LEVEL:-INFO}
    networks: [centralops]

  web:
    <<: *hardening
    depends_on:
      migrate: { condition: service_completed_successfully }
    image: ghcr.io/${CENTRALOPS_IMAGE_OWNER:?}/centralops-web:${CENTRALOPS_TAG:-prod}
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    environment:
      NODE_ENV: production
      # Central (assistente de IA da equipe): o laço roda no servidor web com o JWT de quem usa; as chaves nunca vão ao navegador
      CENTRALOPS_OPENROUTER_KEY: ${CENTRALOPS_OPENROUTER_KEY:-}
      CENTRALOPS_HERMES_LLM_BASE: ${CENTRALOPS_HERMES_LLM_BASE:-http://centralops-hermes:8642/v1}
      CENTRALOPS_HERMES_LLM_KEY: ${CENTRALOPS_HERMES_LLM_KEY:-}
      CENTRALOPS_AGY_SHIM_URL: ${CENTRALOPS_AGY_SHIM_URL:-http://172.26.0.1:8787/v1}
      CENTRALOPS_AGY_SHIM_TOKEN: ${CENTRALOPS_AGY_SHIM_TOKEN:-}
      CENTRALOPS_GROQ_KEY: ${CENTRALOPS_GROQ_KEY:-}
    networks: [edge, centralops]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-coolify}
      - traefik.http.routers.centralops-web.rule=Host(`${CENTRALOPS_DOMAIN:?}`)
      - traefik.http.routers.centralops-web.entrypoints=websecure
      - traefik.http.routers.centralops-web.tls=true
      - traefik.http.routers.centralops-web.tls.certresolver=letsencrypt
      - traefik.http.services.centralops-web.loadbalancer.server.port=3000
      - traefik.http.routers.centralops-web-http.rule=Host(`${CENTRALOPS_DOMAIN}`)
      - traefik.http.routers.centralops-web-http.entrypoints=web
      - traefik.http.routers.centralops-web-http.middlewares=centralops-https
      - traefik.http.middlewares.centralops-https.redirectscheme.scheme=https
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }

  worker:
    <<: *hardening
    image: ghcr.io/${CENTRALOPS_IMAGE_OWNER:?}/centralops-worker:${CENTRALOPS_TAG:-prod}
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      CENTRALOPS_DATABASE_URL: ${CENTRALOPS_DATABASE_URL:?conexão de serviço do Supabase (pooler, modo sessão)}
      CENTRALOPS_SUPABASE_URL: ${CENTRALOPS_SUPABASE_URL:?}
      CENTRALOPS_SUPABASE_SERVICE_KEY: ${CENTRALOPS_SUPABASE_SERVICE_KEY:?}
      CENTRALOPS_AGENT_CTX_SECRET: ${CENTRALOPS_AGENT_CTX_SECRET:?}
      CENTRALOPS_HERMES_BASE: ${CENTRALOPS_HERMES_BASE:-http://hermes:8642/v1}
      CENTRALOPS_HERMES_KEY: ${CENTRALOPS_HERMES_KEY:-}
      CENTRALOPS_OPENROUTER_KEY: ${CENTRALOPS_OPENROUTER_KEY:-}
      CENTRALOPS_HERMES_LLM_BASE: ${CENTRALOPS_HERMES_LLM_BASE:-http://centralops-hermes:8642/v1}
      CENTRALOPS_HERMES_LLM_KEY: ${CENTRALOPS_HERMES_LLM_KEY:-}
      CENTRALOPS_FOCUS_API_BASE: ${CENTRALOPS_FOCUS_API_BASE:-https://api.focusnfe.com.br}
      CENTRALOPS_FOCUS_TOKEN: ${CENTRALOPS_FOCUS_TOKEN:-}
      CENTRALOPS_GROQ_KEY: ${CENTRALOPS_GROQ_KEY:-}
      CENTRALOPS_LOG_LEVEL: ${CENTRALOPS_LOG_LEVEL:-INFO}
    networks: [centralops]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }

  mcp:
    <<: *hardening
    image: ghcr.io/${CENTRALOPS_IMAGE_OWNER:?}/centralops-mcp:${CENTRALOPS_TAG:-prod}
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      CENTRALOPS_AGENT_DATABASE_URL: ${CENTRALOPS_AGENT_DATABASE_URL:?conexão como a role agent_rpc}
      CENTRALOPS_AGENT_CTX_SECRET: ${CENTRALOPS_AGENT_CTX_SECRET:?}
      CENTRALOPS_MCP_KEY: ${CENTRALOPS_MCP_KEY:?}
      CENTRALOPS_MCP_ALLOWED_HOSTS: '["mcp:8000"]'
    networks: [centralops]            # sem labels do Traefik e sem portas: inacessível de fora
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  hermes:
    <<: *hardening
    # FIXE POR DIGEST (nousresearch/hermes-agent@sha256:...): o Hermes tem skills que se auto-modificam e mudanças frequentes
    image: ${HERMES_IMAGE:?nousresearch/hermes-agent@sha256:<digest>}
    command: ["gateway", "run"]
    depends_on:
      mcp: { condition: service_healthy }
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${CENTRALOPS_HERMES_KEY:?}
      OPENROUTER_API_KEY: ${CENTRALOPS_OPENROUTER_KEY:?}
      CENTRALOPS_MCP_KEY: ${CENTRALOPS_MCP_KEY:?}
    volumes:
      - hermes-data:/opt/data
      - ./hermes/profiles/concierge/config.yaml:/opt/data/profiles/concierge/config.yaml:ro
    networks: [centralops]            # rede interna: só o worker fala com ele
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }

volumes:
  hermes-data:

networks:
  # rede do Traefik do Coolify (já existe na VPS)
  edge:
    external: true
    name: ${EDGE_NETWORK:-coolify}
  # rede privada da stack
  centralops:
    driver: bridge
