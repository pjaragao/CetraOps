[project]
name = "sie-worker"
version = "0.1.0"
description = "Worker do SIÉ JOY OS: consome as filas pgmq (mensagens, envio, fiscal, IA) e executa os jobs agendados"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "sie-agent-contract",
]

[tool.uv.sources]
sie-agent-contract = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[project.scripts]
sie-worker = "sie_worker.main:run"
sie-migrate = "sie_worker.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sie_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: usa o Postgres local do Supabase (supabase start)"]
