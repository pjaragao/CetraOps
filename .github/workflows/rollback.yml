name: Rollback

# Volta a produção para uma versão anterior já publicada (as imagens da tag continuam no GHCR): reaponta `prod` e pede o deploy.
# NÃO desfaz migrations (só para frente): se a versão nova mudou o banco de forma incompatível, corrija com uma nova migration.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a restaurar (ex.: v1.2.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Restaurar ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production          # aprovação manual
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/centralops" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apontar a tag `prod` para a versão pedida
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for image in web worker mcp; do
            docker buildx imagetools create -t "${IMAGE_PREFIX}-${image}:prod" "${IMAGE_PREFIX}-${image}:${TAG}"
          done
      - name: Pedir o deploy ao Coolify
        run: |
          curl -fsS --retry 3 -X GET "$COOLIFY_DEPLOY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
