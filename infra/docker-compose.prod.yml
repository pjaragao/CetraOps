# SIÉ JOY OS — stack de produção na VPS (Coolify + Traefik). O banco NÃO roda aqui: é o Supabase Cloud (sa-east-1).
#
# Só o `web` é público (Traefik, TLS automático). `worker`, `mcp` e `hermes` ficam na rede interna, sem porta publicada:
#   web ──(Supabase, JWT do usuário + RLS)──▶ Supabase
#   worker ──▶ Supabase (conexão de serviço) · Meta · Telegram · Focus NFe · OpenRouter · Hermes
#   hermes ──▶ OpenRouter · mcp
#   mcp ──▶ Supabase (role agent_rpc: só EXECUTE em agent.*)
#
# Segredos: variáveis criptografadas do Coolify (modelo em infra/.env.example). Nada de .env versionado.
# Subir à mão (fora do Coolify):  docker compose --env-file .env -f infra/docker-compose.prod.yml up -d

name: sie-joy-os

x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  web:
    <<: *hardening
    image: ghcr.io/${SIE_IMAGE_OWNER:?}/sie-web:${SIE_TAG:-prod}
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    environment:
      NODE_ENV: production
    networks: [edge, sie]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-coolify}
      - traefik.http.routers.sie-web.rule=Host(`${SIE_DOMAIN:?}`)
      - traefik.http.routers.sie-web.entrypoints=websecure
      - traefik.http.routers.sie-web.tls=true
      - traefik.http.routers.sie-web.tls.certresolver=letsencrypt
      - traefik.http.services.sie-web.loadbalancer.server.port=3000
      - traefik.http.routers.sie-web-http.rule=Host(`${SIE_DOMAIN}`)
      - traefik.http.routers.sie-web-http.entrypoints=web
      - traefik.http.routers.sie-web-http.middlewares=sie-https
      - traefik.http.middlewares.sie-https.redirectscheme.scheme=https
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }

  worker:
    <<: *hardening
    image: ghcr.io/${SIE_IMAGE_OWNER:?}/sie-worker:${SIE_TAG:-prod}
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SIE_DATABASE_URL: ${SIE_DATABASE_URL:?conexão de serviço do Supabase (pooler, modo sessão)}
      SIE_SUPABASE_URL: ${SIE_SUPABASE_URL:?}
      SIE_SUPABASE_SERVICE_KEY: ${SIE_SUPABASE_SERVICE_KEY:?}
      SIE_AGENT_CTX_SECRET: ${SIE_AGENT_CTX_SECRET:?}
      SIE_HERMES_BASE: ${SIE_HERMES_BASE:-http://hermes:8642/v1}
      SIE_HERMES_KEY: ${SIE_HERMES_KEY:-}
      SIE_OPENROUTER_KEY: ${SIE_OPENROUTER_KEY:-}
      SIE_FOCUS_API_BASE: ${SIE_FOCUS_API_BASE:-https://api.focusnfe.com.br}
      SIE_FOCUS_TOKEN: ${SIE_FOCUS_TOKEN:-}
      SIE_GROQ_KEY: ${SIE_GROQ_KEY:-}
      SIE_LOG_LEVEL: ${SIE_LOG_LEVEL:-INFO}
    networks: [sie]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }

  mcp:
    <<: *hardening
    image: ghcr.io/${SIE_IMAGE_OWNER:?}/sie-mcp:${SIE_TAG:-prod}
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      SIE_AGENT_DATABASE_URL: ${SIE_AGENT_DATABASE_URL:?conexão como a role agent_rpc}
      SIE_AGENT_CTX_SECRET: ${SIE_AGENT_CTX_SECRET:?}
      SIE_MCP_KEY: ${SIE_MCP_KEY:?}
      SIE_MCP_ALLOWED_HOSTS: '["mcp:8000"]'
    networks: [sie]            # sem labels do Traefik e sem portas: inacessível de fora
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  hermes:
    <<: *hardening
    # FIXE POR DIGEST (nousresearch/hermes-agent@sha256:...): o Hermes tem skills que se auto-modificam e mudanças frequentes
    image: ${HERMES_IMAGE:?nousresearch/hermes-agent@sha256:<digest>}
    command: ["gateway", "run"]
    depends_on:
      mcp: { condition: service_healthy }
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${SIE_HERMES_KEY:?}
      OPENROUTER_API_KEY: ${SIE_OPENROUTER_KEY:?}
      SIE_MCP_KEY: ${SIE_MCP_KEY:?}
    volumes:
      - hermes-data:/opt/data
      - ./hermes/profiles/concierge/config.yaml:/opt/data/profiles/concierge/config.yaml:ro
    networks: [sie]            # rede interna: só o worker fala com ele
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }

volumes:
  hermes-data:

networks:
  # rede do Traefik do Coolify (já existe na VPS)
  edge:
    external: true
    name: ${EDGE_NETWORK:-coolify}
  # rede privada da stack
  sie:
    driver: bridge
