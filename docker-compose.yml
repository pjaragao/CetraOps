# Deploy do homelab (Coolify). As imagens NÃO são construídas aqui: o GitHub Actions (.github/workflows/homelab-images.yml) as publica
# em ghcr.io e o servidor só baixa — o build do Next.js estourava a memória do WSL2.
# CENTRALOPS_TAG (variável do app no Coolify): `homelab` = último main (padrão) · `homelab-<sha>` = versão fixa (rollback).
services:
  # Roda a cada deploy ANTES do web e do worker: confere o banco e aplica as migrations que faltarem
  # (e garante o administrador inicial). Se falhar, web e worker não sobem sobre um banco desatualizado.
  # Log: docker logs centralops-migrate · ver apps/worker/centralops_worker/migrate.py
  centralops-migrate:
    image: ghcr.io/pjaragao/centralops-worker:${CENTRALOPS_TAG:-homelab}
    pull_policy: always
    container_name: centralops-migrate
    command: ["centralops-migrate"]
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: "no"
    networks:
      - supabase_default
      - services_internal
    env_file:
      - .env

  centralops-web:
    image: ghcr.io/pjaragao/centralops-web:${CENTRALOPS_TAG:-homelab}
    pull_policy: always
    container_name: centralops-web
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: unless-stopped
    ports:
      - "3050:3000"
    networks:
      - supabase_default
      - services_internal
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    depends_on:
      centralops-migrate:
        condition: service_completed_successfully

  centralops-worker:
    image: ghcr.io/pjaragao/centralops-worker:${CENTRALOPS_TAG:-homelab}
    pull_policy: always
    container_name: centralops-worker
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: unless-stopped
    networks:
      - supabase_default
      - services_internal
    env_file:
      - .env
    depends_on:
      centralops-migrate:
        condition: service_completed_successfully
      centralops-mcp:
        condition: service_started

  centralops-mcp:
    image: ghcr.io/pjaragao/centralops-mcp:${CENTRALOPS_TAG:-homelab}
    pull_policy: always
    container_name: centralops-mcp
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: unless-stopped
    networks:
      - supabase_default
      - services_internal
    env_file:
      - .env

networks:
  supabase_default:
    external: true
  services_internal:
    external: true
