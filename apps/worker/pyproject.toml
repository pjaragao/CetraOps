[project]
name = "centralops-worker"
version = "0.1.0"
description = "Worker do CentralOps: consome as filas pgmq (mensagens, envio, fiscal, IA) e executa os jobs agendados"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.3.7",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "lxml>=5.3",
  "cryptography>=43",
  "centralops-agent-contract",
]

[tool.uv.sources]
centralops-agent-contract = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[project.scripts]
centralops-worker = "centralops_worker.main:run"
centralops-migrate = "centralops_worker.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centralops_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: usa o Postgres local do Supabase (supabase start)"]
