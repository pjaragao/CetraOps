# Hermes exclusivo do CentralOps (LLM = AGY). Roda no homelab FORA do Coolify, como os bots (luisa-bot, sie-joy-bot):
#   mkdir -p ~/centralops-hermes/data && cp infra/hermes/central/docker-compose.yml ~/centralops-hermes/
#   cp infra/hermes/central/{config.yaml,SOUL.md} ~/centralops-hermes/data/   # + data/.env (ver README.md)
#   cd ~/centralops-hermes && docker compose up -d
# O web e o worker do CentralOps falam com ele pela rede services_internal: http://centralops-hermes:8642/v1
services:
  centralops-hermes:
    image: nousresearch/hermes-agent@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    container_name: centralops-hermes
    restart: unless-stopped
    command: gateway run
    env_file: ./data/.env
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_UID=1000
      - HERMES_GID=1000
    volumes:
      - ./data:/opt/data
    ports:
      - "127.0.0.1:8648:8642"      # só para teste local; o CentralOps usa a rede interna
    networks:
      - services_internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      paulojr.stack: "centralops-hermes"
      paulojr.type: "llm"
      paulojr.origin: "dockerhub"

networks:
  services_internal:
    external: true
