services:
  # Roda a cada deploy ANTES do web e do worker: confere o banco e aplica as migrations que faltarem
  # (e garante o administrador inicial). Se falhar, web e worker não sobem sobre um banco desatualizado.
  # Log: docker logs centralops-migrate · ver apps/worker/centralops_worker/migrate.py
  centralops-migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: centralops-migrate
    command: ["centralops-migrate"]
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: "no"
    networks:
      - supabase_default
      - services_internal
    env_file:
      - .env

  centralops-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: "https://mpbflndsk201-wsl.tabby-broadnose.ts.net:8001"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE"
    container_name: centralops-web
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: unless-stopped
    ports:
      - "3050:3000"
    networks:
      - supabase_default
      - services_internal
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    depends_on:
      centralops-migrate:
        condition: service_completed_successfully

  centralops-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: centralops-worker
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: unless-stopped
    networks:
      - supabase_default
      - services_internal
    env_file:
      - .env
    depends_on:
      centralops-migrate:
        condition: service_completed_successfully
      centralops-mcp:
        condition: service_started

  centralops-mcp:
    build:
      context: .
      dockerfile: apps/agent/mcp_server/Dockerfile
    container_name: centralops-mcp
    labels:
      coolify.managed: "true"
      coolify.applicationId: "3"
      coolify.type: "application"
      coolify.name: "tbwzuutpdgahtsr6rayvxhea"
    restart: unless-stopped
    networks:
      - supabase_default
      - services_internal
    env_file:
      - .env

networks:
  supabase_default:
    external: true
  services_internal:
    external: true
