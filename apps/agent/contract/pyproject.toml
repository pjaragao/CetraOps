[project]
name = "sie-agent-contract"
version = "0.1.0"
description = "Contrato do agente de IA: token de contexto, perfis de ferramentas e esquemas — compartilhado pelo roteador (worker) e pelo servidor MCP"
requires-python = ">=3.12"
dependencies = ["pyjwt>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sie_agent_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
