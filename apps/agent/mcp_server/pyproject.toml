[project]
name = "sie-mcp"
version = "0.1.0"
description = "Servidor MCP do SIÉ JOY OS: expõe ao Hermes as ferramentas seguras (funções agent.* do banco) com token de contexto"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sie-agent-contract",
]

[tool.uv.sources]
sie-agent-contract = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
sie-mcp = "sie_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sie_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: usa o Postgres local do Supabase (supabase start)"]
